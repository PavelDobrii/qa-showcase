# Web server in front of the Toolshop API.
# PHP runs in the laravel-api container (PHP-FPM, port 9000).
server {
    listen 80;
    root /var/www/public;

    location / {
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
