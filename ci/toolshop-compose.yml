# A local copy of the Toolshop demo app for CI.
#
# The public site is behind Cloudflare bot protection. It does not let a browser
# from a CI server open the shop, so in CI the tests use this copy instead.
# Images are published by the app authors: https://github.com/testsmith-io/practice-software-testing
name: toolshop

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      # Default settings of the demo app. The database lives only inside this test container.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api:2.5
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DISABLE_LOGGING: "true"
    depends_on:
      - mariadb

  web:
    # Official nginx: the web image of the app authors is built only for ARM
    # and does not start on the x86 servers of GitHub Actions.
    image: nginx:1.28-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8091:80"
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui:2.5
    command: ng serve --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"
